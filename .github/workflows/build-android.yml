name: Build Mega Movies APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify project files
        run: |
          echo "Repository root: $PWD"
          test -f settings.gradle || { echo "::error::settings.gradle is missing. Upload the files to the repository root, not inside another folder."; exit 1; }
          test -f build.gradle || { echo "::error::build.gradle is missing. Upload the files to the repository root."; exit 1; }
          test -f app/build.gradle || { echo "::error::app/build.gradle is missing. The app folder was not uploaded correctly."; exit 1; }
          test -f app/src/main/AndroidManifest.xml || { echo "::error::AndroidManifest.xml is missing."; exit 1; }

      - name: Install Gradle 8.13
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          echo "/tmp/gradle/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare signing key
        env:
          MEGA_KEYSTORE_BASE64: ${{ secrets.MEGA_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f mega-movies-upload-key.jks ]; then
            if [ -n "$MEGA_KEYSTORE_BASE64" ]; then
              echo "$MEGA_KEYSTORE_BASE64" | base64 --decode > mega-movies-upload-key.jks
            else
              echo "::error::Add the MEGA_KEYSTORE_BASE64 repository secret."
              exit 1
            fi
          fi
          ls -lh mega-movies-upload-key.jks

      - name: Prepare Firebase configuration
        env:
          MEGA_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.MEGA_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -z "$MEGA_GOOGLE_SERVICES_JSON_BASE64" ]; then
              echo "::error::app/google-services.json is missing and MEGA_GOOGLE_SERVICES_JSON_BASE64 is not configured."
              exit 1
            fi
            echo "$MEGA_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          fi
          python3 -m json.tool app/google-services.json >/dev/null
          python3 -c 'import json; x=json.load(open("app/google-services.json")); assert any(c.get("client_info",{}).get("android_client_info",{}).get("package_name")=="com.megamovies.app" for c in x.get("client",[])), "Firebase config does not contain com.megamovies.app"' || {
            echo "::error::Firebase Android app must use package com.megamovies.app"
            exit 1
          }

      - name: Build release APK and AAB
        env:
          MEGA_KEYSTORE_PASSWORD: ${{ secrets.MEGA_KEYSTORE_PASSWORD }}
          MEGA_KEY_PASSWORD: ${{ secrets.MEGA_KEY_PASSWORD }}
          MEGA_KEY_ALIAS: mega_movies
        run: |
          if [ -z "$MEGA_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing repository secret: MEGA_KEYSTORE_PASSWORD"
            exit 1
          fi
          if [ -z "$MEGA_KEY_PASSWORD" ]; then
            echo "::error::Missing repository secret: MEGA_KEY_PASSWORD"
            exit 1
          fi
          gradle --version
          gradle --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mega-movies-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: mega-movies-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
